name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.0
          cache: true
          check-latest: false

      - name: Verify modules and licenses
        run: |
          go mod verify
          bash ./scripts/verify-licenses
          bash ./scripts/check-build-downloads

      - name: Format and vet
        run: |
          test -z "$(gofmt -l -- $(find . -name '*.go' -not -path './vendor/*' -print))"
          go vet ./...

      - name: Test with race detector
        run: bash ./scripts/test

      - name: Build supported executables
        env:
          CROSS: "1"
          VERSION_OVERRIDE: "0.10.5"
        run: bash ./scripts/build
